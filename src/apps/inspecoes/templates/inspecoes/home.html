{% extends 'base.html' %}
{% block title %}Início — Inspeções Prediais MPDFT{% endblock %}

{% block content %}
<div class="text-center mb-4">
  <h1 class="h2 mb-1">O que você deseja registrar?</h1>
  <p class="text-muted">Escolha um dos módulos abaixo</p>
</div>

<div class="row justify-content-center g-4">
  <div class="col-md-4">
    <a href="{% url 'inspecoes:list' %}" class="text-decoration-none">
      <div class="card h-100 shadow-sm border-primary">
        <div class="card-body text-center py-5">
          <i class="bi bi-building-check text-primary" style="font-size:3rem;" aria-hidden="true"></i>
          <h2 class="h4 mt-3 mb-0 text-dark">Inspeção Predial</h2>
        </div>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="{% url 'inspecoes:visita_localidades' %}" class="text-decoration-none">
      <div class="card h-100 shadow-sm border-success">
        <div class="card-body text-center py-5">
          <i class="bi bi-clipboard-check text-success" style="font-size:3rem;" aria-hidden="true"></i>
          <h2 class="h4 mt-3 mb-0 text-dark">Visita Técnica</h2>
        </div>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="{% url 'inspecoes:acompanhamento_painel' %}" class="text-decoration-none">
      <div class="card h-100 shadow-sm border-info">
        <div class="card-body text-center py-5">
          <i class="bi bi-kanban text-info" style="font-size:3rem;" aria-hidden="true"></i>
          <h2 class="h4 mt-3 mb-0 text-dark">Acompanhamento</h2>
        </div>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="{% url 'acessibilidade:dashboard' %}" class="text-decoration-none">
      <div class="card h-100 shadow-sm border-warning">
        <div class="card-body text-center py-5">
          <i class="bi bi-universal-access text-warning" style="font-size:3rem;" aria-hidden="true"></i>
          <h2 class="h4 mt-3 mb-0 text-dark">Acessibilidade</h2>
        </div>
      </div>
    </a>
  </div>
</div>
{% endblock %}
